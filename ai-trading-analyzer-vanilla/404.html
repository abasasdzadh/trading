<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>AI Trading Analyzer</title>
  <script>
    // GitHub Pages SPA fallback - redirect to index.html with hash
    const path = window.location.pathname;
    const hash = path.replace(/\.html$/, '').replace(/^\//, '');
    window.location.replace(window.location.origin + window.location.pathname + '#/' + hash + window.location.search);
  </script>
</head>
<body><p>Redirecting...</p></body>
</html>
