<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="AI Trading Analyzer - Client-side trading decision support system with 22+ indicators, 7 strategies, backtesting, and AI analysis">
  <meta name="theme-color" content="#0f1117">
  <title>AI Trading Analyzer</title>
  <link rel="stylesheet" href="css/styles.css">
  <!-- Lightweight Charts v5 from CDN -->
  <script src="https://unpkg.com/lightweight-charts@5.0.1/dist/lightweight-charts.standalone.production.js"></script>
  <!-- Favicon (inline SVG) -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📈</text></svg>">
</head>
<body>
  <div id="app">
    <!-- Demo Banner -->
    <div id="demo-banner-container"></div>

    <!-- Top Bar -->
    <header class="topbar" id="topbar">
      <div class="topbar-left">
        <button class="btn-icon hamburger" id="hamburger-btn" aria-label="Menu">☰</button>
        <div class="logo">
          <span class="logo-icon">📊</span>
          <span class="logo-text">TA</span>
        </div>
      </div>
      <div class="topbar-center">
        <div class="symbol-selector" id="symbol-selector">
          <span id="current-symbol">BTCUSDT</span>
        </div>
      </div>
      <div class="topbar-right">
        <div class="capability-badge" id="capability-badge" title="Capability Level">Lv 0</div>
      </div>
    </header>

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <nav class="sidebar-nav">
        <div class="nav-section">
          <div class="nav-section-title">Analysis</div>
          <a href="#/dashboard" class="nav-item active" data-route="#/dashboard">
            <span class="nav-icon">📊</span>
            <span class="nav-label">Dashboard</span>
          </a>
          <a href="#/chart/BTCUSDT" class="nav-item" data-route="#/chart">
            <span class="nav-icon">📈</span>
            <span class="nav-label">Chart</span>
          </a>
          <a href="#/markets" class="nav-item" data-route="#/markets">
            <span class="nav-icon">🌐</span>
            <span class="nav-label">Markets</span>
          </a>
          <a href="#/scanner" class="nav-item" data-route="#/scanner">
            <span class="nav-icon">🔍</span>
            <span class="nav-label">Scanner</span>
          </a>
          <a href="#/signals" class="nav-item" data-route="#/signals">
            <span class="nav-icon">🎯</span>
            <span class="nav-label">Signals</span>
          </a>
          <a href="#/strategies" class="nav-item" data-route="#/strategies">
            <span class="nav-icon">🧠</span>
            <span class="nav-label">Strategies</span>
          </a>
        </div>

        <div class="nav-section">
          <div class="nav-section-title">Trading</div>
          <a href="#/backtest" class="nav-item" data-route="#/backtest">
            <span class="nav-icon">⏪</span>
            <span class="nav-label">Backtest</span>
          </a>
          <a href="#/paper-trading" class="nav-item" data-route="#/paper-trading">
            <span class="nav-icon">📝</span>
            <span class="nav-label">Paper Trading</span>
          </a>
          <a href="#/journal" class="nav-item" data-route="#/journal">
            <span class="nav-icon">📔</span>
            <span class="nav-label">Journal</span>
          </a>
        </div>

        <div class="nav-section">
          <div class="nav-section-title">Tools</div>
          <a href="#/alerts" class="nav-item" data-route="#/alerts">
            <span class="nav-icon">🔔</span>
            <span class="nav-label">Alerts</span>
          </a>
          <a href="#/settings" class="nav-item" data-route="#/settings">
            <span class="nav-icon">⚙️</span>
            <span class="nav-label">Settings</span>
          </a>
          <a href="#/about" class="nav-item" data-route="#/about">
            <span class="nav-icon">ℹ️</span>
            <span class="nav-label">About</span>
          </a>
        </div>
      </nav>
    </aside>

    <!-- Mobile drawer overlay -->
    <div class="drawer-overlay" id="drawer-overlay"></div>

    <!-- Main Content -->
    <main class="main-content" id="app-content">
      <div class="loading-spinner" style="margin:100px auto;"></div>
    </main>
  </div>

  <!-- Toast container -->
  <div id="toast-container" class="toast-container"></div>

  <!-- App Entry -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
